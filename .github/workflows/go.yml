name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-go@v4
        with:
          go-version: "1.27.1"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install ANTLR
        run: |
          curl -fsSL https://www.antlr.org/download/antlr-4.13.2-complete.jar \
            -o "$RUNNER_TEMP/antlr-4.13.2-complete.jar"
          printf '#!/bin/sh\nexec java -jar "%s/antlr-4.13.2-complete.jar" "$@"\n' \
            "$RUNNER_TEMP" > "$RUNNER_TEMP/antlr4"
          chmod +x "$RUNNER_TEMP/antlr4"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build public version
        run: make public

      - name: Test
        run: make test
